openapi: 3.1.0
info:
  title: Forge Platform API
  version: 1.0.0
  description: >-
    REST contract consumed by the Forge SPA (catalog, approval queue, trace
    viewer). Consistent with the data model (data-model.md) and the agent DNA
    contract (dna-schema.json). Governance is structural: publishing is
    eval-gated (409 when the gate has not passed), approvals expire server-side
    and there is no extend/auto-approve operation, and a role header
    demonstrates segregation of duties (NFR-5). This is a demonstration
    contract, not a production auth design.
servers:
  - url: /api/v1

tags:
  - name: Agents
  - name: Runs
  - name: Approvals
  - name: Knowledge
  - name: Evals
  - name: Tools

paths:
  /agents:
    get:
      tags: [Agents]
      summary: List agents in the catalog
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Agents]
      summary: Create an agent (identity only; versions are added separately)
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgent' }
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}/versions:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      summary: List versions of an agent
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Agents]
      summary: Create a new agent version (draft) from a DNA document
      description: >-
        The dna body is validated against dna-schema.json before the version is
        accepted. Invalid DNA returns 400 with the validation errors in details.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentVersion' }
      responses:
        '201':
          description: Draft version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Agents]
      summary: Get one agent version, including its DNA
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Agent version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/versions/{version}/publish:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Agents]
      summary: Publish a version (hard eval gate)
      description: >-
        Transitions draft to published ONLY if the version has a completed eval
        run with passed=true for the suite its own DNA declares
        (evals.suite_ref) — a run of a different version or a different suite
        satisfies nothing (FR-F2). If the gate has not passed, the server
        returns 409 with code publish_gate_unmet and does not publish. The gate
        cannot be bypassed: there is no force flag and no other route to
        status=published. (The seed script's directly-published demo versions
        are the one documented exception, marked by a null
        published_eval_run_id.) Requires the configurator role.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: >-
            Version published. published_eval_run_id records the passing run
            that satisfied the gate — the evidence travels with the version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Publish gate not satisfied (code publish_gate_unmet) — no completed
            eval run, a failed one, or a declared suite that is not installed;
            the version remains in draft. Also answered (code
            version_not_draft) when the version is already published or
            suspended: only a draft can be published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: publish_gate_unmet
                message: Eval suite has not passed for this version
                details:
                  suite_ref: meridian-ap-eval-suite@1.0.0
                  latest_eval_run_id: null
                  latest_eval_run_passed: false
                  passed_count: 17
                  total: 20

  /agents/{agentId}/versions/{version}/suspend:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Agents]
      summary: Suspend a published version (manual)
      description: Halts new runs; history is retained. Requires the configurator role.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
      responses:
        '200':
          description: Version suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Version is not in a suspendable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs:
    post:
      tags: [Runs]
      summary: Start a run of a published agent version
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRun' }
      responses:
        '202':
          description: Run accepted and started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Agent version is not published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      summary: Get run status and summary
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/trace:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      summary: Get the full run trace (steps, tool calls, decisions)
      description: >-
        A projection of the append-only events for this run (ADR-008). Every
        model call, tool invocation, rule applied, decision, and **governance
        refusal** is present and ordered, so the run is reconstructable (FR-G1).
        A run the platform stopped carries exactly one step of kind
        `governance`, holding the machine-readable reason code and the
        explanation that goes with it.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Ordered trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTrace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /approvals:
    get:
      tags: [Approvals]
      summary: List approvals (defaults to pending)
      description: >-
        The queue as an approver works it, oldest first, each item carrying the
        proposed action **and the evidence to decide it** (FR-E1) so a decision
        needs no second tab and no second request. Needs `read`.

        Expiry is applied before the list is built, so nothing returned as
        pending has already lapsed — and asking for the queue is one of the
        moments a lapsed approval is canceled.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, granted, rejected, expired]
            default: pending
      responses:
        '200':
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /approvals/report:
    get:
      tags: [Approvals]
      summary: Autonomy-promotion report — approval rates per action category (read-only)
      description: >-
        What the approvers actually did, per agent version and tool — the pair a
        DNA grant names (FR-E5). Answers Rosa's approval-fatigue risk with
        evidence: a category with a long run of grants and no rejections is
        named as a candidate for an autonomy upgrade.

        **Read-only, and there is no endpoint that applies it.** Autonomy is a
        property of a published DNA document, so raising it means authoring a
        new version and putting it through the eval gate — never a statistic
        crossing a line. Needs `read`.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: One row per action category, busiest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutonomyCandidate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /approvals/{approvalId}:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    get:
      tags: [Approvals]
      summary: Get one approval with its evidence
      description: >-
        Needs `read`. Expiry is enforced here too: no path serves a lapsed
        approval as though it were still live.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /approvals/{approvalId}/approve:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [Approvals]
      summary: Approve a pending action (resumes the run)
      description: >-
        Releases **exactly this action** — the call the run parked, with the
        arguments the tool gateway already validated. The request body carries a
        note and no arguments, so there is no shape of request that approves one
        action and runs another (FR-E2). The approval is written `granted`
        before anything executes; the run then continues through the same tool
        gateway and reaches a terminal state of its own.

        Needs `approval.decide`, which only the approver role holds and which no
        role holding `agent.configure` may ever hold (NFR-5). A refused attempt
        is recorded as a `governance.permission_denied` event. Fails with 409 if
        the approval is not pending — including one whose deadline has passed.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Approved; the run resumed and executed the released action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Approval is no longer pending (already decided or expired)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: approval_not_pending
                message: >-
                  approval ... is expired; only a pending approval can be
                  decided. Its deadline passed and the run was canceled — expiry
                  never approves, and no operation extends it

  /approvals/{approvalId}/reject:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [Approvals]
      summary: Reject a pending action (cancels the run)
      description: >-
        Refuses the action and cancels its run; nothing is executed, and the
        refusal is recorded with the actor, the timestamp, and the optional note
        (FR-E4). Needs `approval.decide`.

        **These four operations are the whole surface.** There is deliberately
        no extend, no snooze, no bulk-approve and no auto-approve anywhere in
        this API: expiry is enforced server-side and always cancels, never
        approves (FR-E3, fail-closed). The absence is the control, and
        `tests/test_approvals.py` asserts it against the served contract.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Rejected; the run was canceled and nothing ran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Approval is no longer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /knowledge/collections:
    get:
      tags: [Knowledge]
      summary: List knowledge collections with authority levels
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Collection list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeCollection' }

  /knowledge/collections/{collectionId}/ingest:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    post:
      tags: [Knowledge]
      summary: Trigger ingestion for a collection
      description: >-
        Chunks and embeds source documents into the collection. Requires the
        configurator role.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '202':
          description: Ingestion accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /knowledge/chunks/{chunkId}:
    parameters:
      - $ref: '#/components/parameters/ChunkId'
    get:
      tags: [Knowledge]
      summary: Get a knowledge chunk with its authority level and citation
      description: >-
        The verifiability endpoint (FR-D4): a document citation in a decision
        resolves — via the retrieval step in the run trace — to a chunk id, and
        this endpoint serves the chunk a human then reads: content, section,
        owner, effective date, authority level.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Knowledge chunk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeChunk' }
        '404': { $ref: '#/components/responses/NotFound' }

  /knowledge/remediation:
    get:
      tags: [Knowledge]
      summary: List flagged knowledge conflicts awaiting their owners
      description: >-
        Every conflict retrieval has detected, newest first — the stale-document
        work queue (FR-D5). Written by the platform when sources disagree;
        read by the knowledge owners who fix the documents.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Remediation items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemediationItem' }

  /eval/suites:
    get:
      tags: [Evals]
      summary: List eval suites
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Suite list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalSuite' }

  /eval/suites/{suiteId}/run:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    post:
      tags: [Evals]
      summary: Run a suite against an agent version
      description: >-
        Executes every case in the suite and records a passed boolean that the
        publish gate reads. Requires the configurator role.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunSuiteRequest' }
      responses:
        '202':
          description: Eval run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /eval/runs:
    get:
      tags: [Evals]
      summary: List eval runs, optionally for one agent version
      description: >-
        Newest first. agent_version_id narrows the list to one version — the
        query a client asks to learn whether that version's publish gate is met
        before offering the publish action.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
        - name: agent_version_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eval runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalRun' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /eval/runs/{evalRunId}:
    parameters:
      - $ref: '#/components/parameters/EvalRunId'
    get:
      tags: [Evals]
      summary: Get eval run results (per-case and aggregate)
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Eval run results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tools:
    get:
      tags: [Tools]
      summary: List the registered tool catalog (read-only)
      description: >-
        The tools an agent may be granted in its DNA, with their typed in/out
        contracts. Read-only — tools are registered out of band, never created
        through this API.
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Tool catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tool' }

components:
  parameters:
    RoleHeader:
      name: X-Forge-Role
      in: header
      required: true
      description: >-
        Demonstration role for segregation of duties (NFR-5). configurator holds
        read, agent.configure, agent.publish and run.start; approver holds read
        and approval.decide; viewer holds read only. No role holds both
        agent.configure/agent.publish and approval.decide — the person who
        decides what an agent may do is never the person who approves what it
        proposes, and the build refuses to start if that ever stops being true.
        Reading the approval queue needs only read, so an auditor can inspect
        every decision without being able to make one; approving or rejecting
        needs approval.decide. A role lacking the permission for an operation
        gets 403, and the refusal is recorded as a governance.permission_denied
        event. Not authentication.
      schema:
        type: string
        enum: [configurator, approver, viewer]
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      description: Semver of the agent version, e.g. 1.0.0
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChunkId:
      name: chunkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvalRunId:
      name: evalRunId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request or DNA that fails schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The X-Forge-Role is not permitted to perform this operation (NFR-5)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine-readable error code }
        message: { type: string, description: Human-readable summary }
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (e.g. validation errors)

    CreateAgent:
      type: object
      required: [slug, name, type]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
        type: { type: string, enum: [chatbot, workflow, autonomous] }
        description: { type: string }

    Agent:
      type: object
      required: [id, tenant_id, slug, name, type]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        slug: { type: string }
        name: { type: string }
        type: { type: string, enum: [chatbot, workflow, autonomous] }
        description: { type: string }
        created_at: { type: string, format: date-time }

    CreateAgentVersion:
      type: object
      required: [dna]
      properties:
        dna:
          $ref: '#/components/schemas/Dna'

    Dna:
      type: object
      description: >-
        A complete agent DNA document. The authoritative structure is
        dna-schema.json (JSON Schema draft 2020-12); it is validated there at
        write time and is not re-declared field by field here so the contract
        stays single-sourced. Top-level blocks: identity, instructions, tools,
        knowledge, model, guardrails, evals. Fail-closed governance fields
        (escalate_on_no_rule_match, require_citations, publish_gate,
        authority_policy) are const-locked and cannot be disabled.
      additionalProperties: true
      externalDocs:
        description: Agent DNA JSON Schema
        url: ../dna-schema.json

    AgentVersion:
      type: object
      required: [id, tenant_id, agent_id, version, status, dna]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        agent_id: { type: string, format: uuid }
        version: { type: string, description: semver }
        status: { type: string, enum: [draft, published, suspended] }
        dna: { $ref: '#/components/schemas/Dna' }
        published_eval_run_id:
          type: [string, 'null']
          format: uuid
          description: The passing eval run that satisfied the publish gate, if published
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SuspendRequest:
      type: object
      properties:
        reason: { type: string }

    StartRun:
      type: object
      required: [agent_id, version, input]
      properties:
        agent_id: { type: string, format: uuid }
        version: { type: string, description: semver of a published version }
        input:
          type: object
          additionalProperties: true
          description: Trigger payload (e.g. the invoice reference to process)

    Run:
      type: object
      required: [id, tenant_id, agent_version_id, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        agent_version_id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, awaiting_approval, completed, escalated, canceled, error]
        trigger: { type: string }
        total_tokens: { type: integer }
        total_cost_usd:
          type: [string, 'null']
          description: >-
            Exact decimal, serialised as a string. Money is never carried as a
            JSON number here: an audit figure rounded through a float is not an
            audit figure. The same convention applies to cost_usd inside a
            model.called event payload.
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    RunTrace:
      type: object
      required: [run_id, steps]
      properties:
        run_id: { type: string, format: uuid }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunStep' }
        events:
          type: array
          description: >-
            The raw append-only events the steps were projected from, in
            append order, including lifecycle events that are not steps
            (run.started, run.completed, run.escalated, run.awaiting_approval,
            run.failed). Served alongside the projection so a reviewer can check
            the trace against its source rather than trusting it (ADR-008).
          items: { $ref: '#/components/schemas/RunEvent' }

    RunEvent:
      type: object
      required: [event_id, type, actor, occurred_at, payload]
      properties:
        event_id:
          type: integer
          format: int64
          description: Monotonic identity; ordering is part of the audit contract
        type:
          type: string
          description: >-
            run.started, model.called, tool.called, decision.made,
            governance.blocked, approval.pending, approval.granted,
            approval.rejected, approval.expired, run.completed, run.escalated,
            run.awaiting_approval, run.canceled, run.failed. The approval events
            carry the deciding actor and the timestamp (FR-E4); approval.expired
            is recorded against `system`, because expiry is the absence of a
            decision rather than one. Outside a run,
            governance.permission_denied records an operation refused to a role
            that lacked its permission.
        actor: { type: string, description: system, seed-script, or role:<role> }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: Typed by event type

    RunStep:
      type: object
      required: [step_no, kind]
      properties:
        step_no: { type: integer }
        kind:
          type: string
          enum: [reason, tool, decision, governance, approval]
          description: >-
            Who acted at this position in the run. `reason`, `tool` and
            `decision` are the agent; `governance` is the platform refusing; and
            `approval` is a **person** — the action the run parked, and the
            approve / reject / expire that answered it (FR-E4).
        model_call:
          type: object
          additionalProperties: true
          description: model id, tokens, cost when kind is reason
        decision:
          type: object
          description: Final action and rule citations when kind is decision
          properties:
            action:
              type: string
              enum: [auto_approve, escalate, block_escalate, priority_queue]
            citations:
              type: array
              minItems: 1
              items:
                type: string
                description: >-
                  Rule ID (R-001) or document citation
                  (AP-Policy-2023.pdf#approval-thresholds)
              description: >-
                What the decision applied, under one citation model (FR-D4):
                governed rule IDs and, for any claim drawn from retrieved
                knowledge, the document#section citations retrieval returned.
                Non-empty by contract (R-092): a decision without citations is
                rejected by the runtime, not merely logged.
            reasoning:
              type: string
              description: Why the action follows from those rules
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: >-
                How confident the agent is in this decision. Required: R-091
                makes low confidence a fail-closed condition, and a floor cannot
                be enforced against a number the agent was free to omit. Below
                the agent's declared guardrails.min_decision_confidence the
                runtime overrides the action and escalates, recording a
                governance step with reason_code low_confidence.
            output:
              type: object
              additionalProperties: true
              description: >-
                Optional agent-specific structured result, for agents whose job
                is extraction rather than adjudication — the normalised invoice
                from the intake agent, for example. Omitted (not null) when the
                agent produced none. The governed part of a decision is always
                the action and its citations; this sits beside them.
        tool_invocation: { $ref: '#/components/schemas/ToolInvocation' }
        governance: { $ref: '#/components/schemas/GovernanceBlock' }
        approval: { $ref: '#/components/schemas/ApprovalStep' }
        created_at: { type: string, format: date-time }

    ApprovalStep:
      type: object
      description: >-
        One state of one approval, present when kind is `approval`. Carries the
        action being decided — tool ref and the exact arguments — because that is
        the scope of the approval, so the log answers "what was authorised"
        without a join and a later edit to the invocation row could not rewrite
        what somebody approved.
      required: [approval_id, status, tool_ref, expires_at]
      properties:
        approval_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, granted, rejected, expired] }
        tool_ref: { type: string }
        args: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        reason_code:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: >-
            `approval_rejected` or `approval_expired` when the approval ended the
            run. Null while pending and on a grant, which ends nothing.

    ToolInvocation:
      type: object
      required: [id, tool_ref, autonomy, status]
      properties:
        id: { type: string, format: uuid }
        tool_ref: { type: string, description: slug@semver }
        autonomy: { type: string, enum: [autonomous, requires_approval, forbidden] }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        status:
          type: string
          enum: [validated, executed, blocked, denied]
          description: >-
            executed — allowed and run. validated — checked and parked: the DNA
            grants this tool only with a human approval, so the call did not run
            and the run stopped in awaiting_approval (FR-E2). blocked — refused
            by policy or validation. denied — the DNA forbids the tool outright.
        error:
          type: [string, 'null']
          description: >-
            Why the gateway refused, when status is blocked or denied — unknown
            tool, missing grant, forbidden tool, invalid arguments, or a config
            the tool cannot honour (FR-C5). Null for an executed or a validated
            (parked) invocation.
        reason_code:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: >-
            The governance code the gateway assigned to this refusal, or null
            when the call executed. The same code appears on the governance step
            that follows, so the refusal and the stop it caused are one story.
        approval_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Set when this call ran only because a person released it. Null for
            an autonomous execution — an action a human signed for must never
            read the same as one the agent took on its own (FR-E4).
        released_by:
          type: [string, 'null']
          description: Who granted the approval that let this call run

    ReasonCode:
      type: string
      description: >-
        Why the platform stopped, blocked, or refused. Defined once in
        app/governance.py and used unchanged by the runtime, the audit log, this
        API, and the UI, so a refusal reads the same everywhere.
      enum:
        - tool_unknown
        - permission_denied
        - args_invalid
        - tool_config_invalid
        - tool_failed
        - approval_required
        - approval_rejected
        - approval_expired
        - no_rule_match
        - knowledge_conflict
        - low_confidence
        - invalid_output
        - step_limit
        - timeout
        - budget_exceeded
        - daily_budget_exceeded
        - provider_unavailable
        - unsupported_definition
        - agent_decision

    GovernanceBlock:
      type: object
      description: >-
        One platform refusal, present when kind is governance. A run carries one
        per stop, and it always says why (FR-C5, FR-G2). Normally that is exactly
        one; a run that paused for a human approval records the refusal that
        paused it (`approval_required`) and then, if it stops again, the one that
        ended it — a rejection, an expiry, or whatever the resumed loop hit.
      required: [reason_code, explanation, terminal_status]
      properties:
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        explanation:
          type: string
          description: >-
            The plain-language sentence recorded alongside the code, written for
            a reader who has never seen the codebase. Served rather than left to
            each client so the words a reviewer reads are the words the platform
            recorded when it acted.
        detail:
          type: [string, 'null']
          description: >-
            The specific circumstance — which tool, which ceiling, which value.
        terminal_status:
          type: string
          enum: [escalated, awaiting_approval, canceled, error]
          description: >-
            The state the run ended in as a result of this refusal.
            `awaiting_approval` is a pause rather than an ending — the run
            resumes on a grant; `canceled` is where a rejected or expired
            approval leaves it, with nothing executed.

    Approval:
      type: object
      required:
        - id
        - tenant_id
        - run_id
        - run_status
        - status
        - proposed_action
        - evidence
        - expires_at
        - seconds_remaining
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        run_id: { type: string, format: uuid }
        run_status:
          type: string
          enum: [running, awaiting_approval, completed, escalated, canceled, error]
          description: >-
            State of the run this approval is holding. `awaiting_approval` while
            pending; after a decision it is whatever the run reached — canceled
            for a rejection or an expiry, and the loop's own outcome for a grant.
        status: { type: string, enum: [pending, granted, rejected, expired] }
        proposed_action: { $ref: '#/components/schemas/ProposedAction' }
        evidence: { $ref: '#/components/schemas/ApprovalEvidence' }
        why_approval_required:
          type: string
          description: >-
            The plain-language sentence the platform recorded when it parked the
            action (the `approval_required` explanation). Served rather than
            written into each client, so the words an approver reads are the
            words the platform acted on.
        expires_at:
          type: string
          format: date-time
          description: >-
            Server-side deadline, written once when the action was parked from
            the agent's `guardrails.approval_sla_seconds` (or the platform
            default). On expiry the run is **canceled**, never approved, and no
            operation in this API moves this value (FR-E3).
        seconds_remaining:
          type: integer
          description: Whole seconds left before the deadline; 0 once it has passed
        decision: { type: [string, 'null'], enum: [approve, reject, null] }
        decided_by:
          type: [string, 'null']
          description: >-
            `role:<role>` for a human decision, `system` for an expiry — which is
            the absence of a decision, so `decision` stays null there.
        decided_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When it was decided; for an expiry, the deadline itself — authority
            lapsed when the clock said so, not when the platform next looked.
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    ProposedAction:
      type: object
      description: >-
        The action the run parked, exactly as the gateway validated it. This *is*
        the scope of the approval: one tool, one set of arguments. Approving it
        authorises this and nothing else — not the same tool again, and not the
        same tool with a different amount (FR-E2).
      required: [tool_invocation_id, tool_ref, autonomy, status]
      properties:
        tool_invocation_id: { type: string, format: uuid }
        tool_ref: { type: string, description: slug@semver, as granted in the DNA }
        autonomy: { type: string, enum: [autonomous, requires_approval, forbidden] }
        args: { type: object, additionalProperties: true }
        status:
          type: string
          description: Always `validated` while pending — checked, and deliberately not run

    ApprovalEvidence:
      type: object
      description: >-
        Everything the agent gathered before it asked for a human, verbatim from
        the run's append-only log (FR-E1). Served with the queue rather than
        behind a second request, because the requirement is a decision in under
        a minute and a round trip per invoice is not that.
      required: [agent, run_input, observations, rule_ids]
      properties:
        agent: { type: string, description: slug@semver of the version that proposed it }
        agent_description: { type: [string, 'null'] }
        run_input:
          type: object
          additionalProperties: true
          description: The trigger payload the run started from
        observations:
          type: array
          items: { $ref: '#/components/schemas/ApprovalObservation' }
        rule_ids:
          type: array
          items: { type: string }
          description: >-
            Governed rule ids present in what the agent gathered — the rules in
            play, so "which rule fired" is on the screen rather than inside a
            payload. A reading of the evidence, not a decision: the agent has not
            made one. The authoritative citations are the ones a decision carries
            (R-092).

    ApprovalObservation:
      type: object
      description: One tool call the agent executed before it asked for a human
      required: [tool_invocation_id, tool_ref, tool_name]
      properties:
        tool_invocation_id: { type: string, format: uuid }
        tool_ref: { type: string }
        tool_name: { type: string }
        args: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }

    AutonomyCandidate:
      type: object
      description: >-
        One action category in the autonomy-promotion report (FR-E5): one agent
        version, one tool. Read-only — nothing in this API applies a promotion.
      required: [agent, agent_version_id, tool_ref, granted, rejected, expired, candidate]
      properties:
        agent: { type: string, description: slug@semver }
        agent_version_id: { type: string, format: uuid }
        tool_ref: { type: string }
        pending: { type: integer }
        granted: { type: integer }
        rejected: { type: integer }
        expired:
          type: integer
          description: >-
            Approvals nobody answered. Each one canceled its run; none of them
            counts as consent.
        decided: { type: integer, description: granted + rejected — expiry is not a decision }
        approval_rate:
          type: [number, 'null']
          description: granted / decided; null when nothing has been decided
        candidate:
          type: boolean
          description: >-
            Enough decisions to mean something, no rejection ever, and a grant
            rate above the threshold. A suggestion for a reviewer, applied only
            by publishing a new DNA version through its eval gate.
        recommendation: { type: string }
        fatigue_note:
          type: [string, 'null']
          description: Set when approvals in this category expired unanswered

    Decision:
      type: object
      additionalProperties: false
      description: >-
        The body of approve and reject: a note, and nothing else. There are
        deliberately **no arguments** here — what is released is the action the
        run already parked (FR-E2) — and no `extend` field, because no operation
        anywhere in this API moves a deadline (FR-E3).
      properties:
        note: { type: string, description: Optional reviewer note recorded with the decision }

    KnowledgeCollection:
      type: object
      required: [id, tenant_id, slug, authority_level]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        slug: { type: string }
        name: { type: string }
        authority_level:
          type: string
          enum: [sme_validated, policy_2023, policy_2019]
        owner: { type: string }

    IngestRequest:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [source_ref]
            properties:
              source_ref: { type: string, description: Document id or URI to ingest }

    IngestJob:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, running, completed, failed] }

    KnowledgeChunk:
      type: object
      required: [id, tenant_id, collection_id, citation, authority_level, content]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        collection_id: { type: string, format: uuid }
        citation:
          type: string
          description: >-
            The citable reference for this chunk — a rule ID (R-020) or an
            anchored document reference (AP-Policy-2023.pdf#approval-thresholds).
            The string a decision carries in `citations` (FR-D4); resolving it
            back to this chunk is what makes a citation verifiable.
        source_ref:
          type: [string, 'null']
          description: Anchored reference to the owning document and section
        section: { type: [string, 'null'] }
        rule_id: { type: [string, 'null'], description: Citation ID such as R-040 }
        authority_level:
          type: string
          enum: [sme_validated, policy_2023, policy_2019]
        topic:
          type: [string, 'null']
          description: >-
            Conflict-detection key — the question this chunk answers. Two chunks
            sharing a topic with different declared_value are a conflict (FR-D2).
        declared_value:
          type: [string, 'null']
          description: The answer this chunk declares for its topic
        effective_date: { type: [string, 'null'], format: date }
        content: { type: string }
        created_at: { type: string, format: date-time }

    RemediationItem:
      type: object
      description: >-
        One detected knowledge conflict, flagged to the stale document's owner
        (FR-D5). A record, not a workflow: retrieval writes it when it finds
        sources disagreeing; the owner resolves the document. winning_source_ref
        is null when authority could not resolve the conflict — the run failed
        closed and every party was flagged.
      required: [id, tenant_id, topic, stale_source_ref, stale_authority_level, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        topic: { type: string, description: The question the sources disagree on }
        stale_source_ref: { type: string }
        stale_authority_level: { type: string }
        stale_declared_value: { type: [string, 'null'] }
        winning_source_ref: { type: [string, 'null'] }
        winning_authority_level: { type: [string, 'null'] }
        winning_declared_value: { type: [string, 'null'] }
        owner: { type: [string, 'null'], description: Who owns the stale document }
        status: { type: string, enum: [open, resolved] }
        detail: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    EvalSuite:
      type: object
      required: [id, tenant_id, slug, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        slug: { type: string }
        name: { type: string }
        version: { type: string, description: semver }
        case_count: { type: integer }
        created_at: { type: string, format: date-time }

    RunSuiteRequest:
      type: object
      required: [agent_id, version]
      properties:
        agent_id: { type: string, format: uuid }
        version: { type: string, description: semver of the version under test }

    EvalRun:
      type: object
      required: [id, tenant_id, suite_id, agent_version_id, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        suite_id: { type: string, format: uuid }
        agent_version_id: { type: string, format: uuid }
        status: { type: string, enum: [running, completed] }
        passed:
          type: [boolean, 'null']
          description: >-
            The publish-gate verdict (FR-F2): true only when every case passed.
            Null while the run is still executing. An empty suite never passes —
            a gate satisfied by zero evidence is no gate.
        total: { type: integer }
        passed_count: { type: integer }
        case_results:
          type: array
          items: { $ref: '#/components/schemas/EvalCaseResult' }
        created_at: { type: string, format: date-time }

    EvalCaseResult:
      type: object
      description: >-
        One scored case: expected vs actual, and every programmatic check
        behind the verdict (FR-F3). Each case executed a real run of the
        version under test, so run_id resolves to a live, inspectable trace.
      required: [code, passed, expected_action, run_id, checks]
      properties:
        code: { type: string, description: Case code, e.g. E-14 }
        scenario: { type: string }
        passed: { type: boolean }
        expected_action: { type: string }
        actual_action:
          type: [string, 'null']
          description: Null when the run reached no decision
        expected_citations:
          type: array
          items: { type: string }
          description: Citations the case requires — a subset of what was cited
        actual_citations:
          type: array
          items: { type: string }
        must_not_call:
          type: array
          items: { type: string }
          description: Tool names that must never appear in the trace, any status
        tools_called:
          type: array
          items: { type: string }
        run_id:
          type: string
          format: uuid
          description: The real run this case executed — its trace is servable
        run_status: { type: string }
        detail: { type: string, description: Why the case failed, or `ok` }
        checks:
          type: array
          description: >-
            The individual asserts — final_action, citations, must_not_call,
            no_unapproved_write, budgets, trace — each with its own verdict.
          items:
            type: object
            required: [name, passed, detail]
            properties:
              name: { type: string }
              passed: { type: boolean }
              detail: { type: string }

    Tool:
      type: object
      required: [ref, name]
      properties:
        ref: { type: string, description: slug@semver used in DNA tool grants }
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the tool's arguments
        output_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the tool's result
